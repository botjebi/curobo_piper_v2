# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - joint8
default_q: [
    0.0,0.0,0.0,0.0003,0.0035,0.0003,0.0,-0.0
]

acceleration_limits: [
   10,10,10,10,10,10,10,10
]

jerk_limits: [
   10000,10000,10000,10000,10000,10000,10000,10000
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

cspace_to_urdf_rules:

# Lula uses collision spheres to define the robot geometry in order to avoid
# collisions with external obstacles.  If no spheres are specified, Lula will
# not be able to avoid obstacles.

collision_spheres:
  - base_link:
    - "center": [-0.005, -0.0, 0.039]
      "radius": 0.06905
  - link1:
    - "center": [-0.002, -0.001, 0.003]
      "radius": 0.05372
  - link2:
    - "center": [0.075, -0.018, -0.004]
      "radius": 0.04497
    - "center": [0.138, -0.03, 0.002]
      "radius": 0.04497
    - "center": [0.205, -0.041, 0.003]
      "radius": 0.04497
  - link3:
    - "center": [0.001, -0.005, 0.0]
      "radius": 0.05628
    - "center": [-0.026, -0.065, -0.001]
      "radius": 0.03628
    - "center": [-0.023, -0.12, -0.005]
      "radius": 0.03628
    - "center": [-0.021, -0.19, 0.001]
      "radius": 0.04628
  - link4:
    - "center": [-0.001, -0.001, 0.001]
      "radius": 0.04684
  - link5:
    - "center": [-0.002, -0.062, 0.001]
      "radius": 0.03687
  - gripper_base:
    - "center": [-0.003, 0.002, 0.028]
      "radius": 0.04637
    - "center": [0.001, 0.053, 0.048]
      "radius": 0.02637
    - "center": [-0.01, -0.053, 0.049]
      "radius": 0.02637
  - link7:
    - "center": [-0.003, -0.016, 0.024]
      "radius": 0.02552
  - link8:
    - "center": [0.001, -0.016, 0.025]
      "radius": 0.02552
